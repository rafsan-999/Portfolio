apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Deployment}#
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: #{Deployment}#
  template:
    metadata:
      labels:
        app: #{Deployment}#
        type: #{Deployment}#
    spec:
      containers:
        - name: #{Deployment}#
          image: iboslimitedbd/#{Deployment}#:#{Build.BuildId}#
          # env:
          #   - name: "API_URL"
          #     value: #{API_URL}#
          #   - name: "REACT_APP_IV_NAME"
          #     value: #{REACT_APP_IV_NAME}#
          #   - name: "REACT_APP_SECRET_NAME"
          #     value: #{REACT_APP_SECRET_NAME}#
          #   - name: "REACT_APP_KEY_NAME"
          #     value: #{REACT_APP_KEY_NAME}#
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: dockercred
---
apiVersion: v1
kind: Service
metadata:
  name: #{Deployment}#
spec:
  selector:
    app: #{Deployment}#
  ports:
    - port: 80
      targetPort: 80
